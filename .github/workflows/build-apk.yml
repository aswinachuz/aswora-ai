name: Build Aswora AI Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Client Dependencies
        working-directory: client
        run: npm install

      - name: Build React Production Bundle
        working-directory: client
        run: npm run build

      - name: Synchronize Capacitor with Android Project
        working-directory: client
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x client/android/gradlew

      - name: Build Android Debug APK
        working-directory: client/android
        run: ./gradlew assembleDebug --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aswora-ai-debug
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Aswora AI v1.0.0 — Official Android Release"
          body: |
            ## Aswora AI Android Application (v1.0.0)

            Installable APK for Android devices.

            ### Features:
            - Autonomous AI chat powered by open-weight models (Llama 3.3 70B, Llama 3.1 8B, Mixtral)
            - Real-time token streaming with syntax-highlighted code blocks
            - Grounded reference documents (RAG)
            - Curated prompt library
            - Dark / Light themes and mobile gesture navigation
            
            ### Installation:
            1. Download `app-debug.apk` to your Android device.
            2. Tap to install (enable "Install unknown apps" if prompted).
            3. Open and enjoy Aswora AI!
          files: client/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
